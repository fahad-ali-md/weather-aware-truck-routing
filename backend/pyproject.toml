[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-cf>=0.2.14",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "httpx>=0.28.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
    "workers-py==1.16.2",
    "workers-runtime-sdk",
]

# Conventional server dependencies stay installed locally, outside the Worker bundle.
server = [
    "celery[redis]>=5.7.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.9",
]

[tool.uv]
default-groups = ["dev", "server"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["python_modules", ".venv-workers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
